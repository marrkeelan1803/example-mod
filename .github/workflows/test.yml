
name: Build Android64 Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - name: Upload mod
        uses: actions/upload-arifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}/*.geode
