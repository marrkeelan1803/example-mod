name: Build Geode Mod

on:
workflow_dispatch:
push:
branches:
- “**”

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - name: Build Android64 mod
    id: build
    uses: geode-sdk/build-geode-mod@main
    with:
      target: Android64

  - name: Upload mod
    uses: actions/upload-artifact@v4
    with:
      name: Android64-Geode-Mod
      path: ${{ steps.build.outputs.build-output }}/*.geode

